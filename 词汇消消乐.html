                gameArea.innerHTML = '';
                gameArea.classList.remove('active', 'dual-mode');

                const words = getSelectedWords();
                const pairMode = levelConfig.pairMode;
                const mode = levelConfig.mode;
                const bubbleData = [];
                for (let word of words) {
                    const pairText1 = word.chinese;
                    const pairText2 = pairMode === 'thai' ? word.thai : word.pinyin;
                    bubbleData.push({ wordId: word.id, pairKey: word.id + '_a', text: pairText1, type: 'chinese',
                        lang: 'chinese' });
                    bubbleData.push({ wordId: word.id, pairKey: word.id + '_b', text: pairText2, type: 'pair',
                        lang: pairMode === 'thai' ? 'thai' : 'pinyin' });
                }

                // 计算每个气泡尺寸
                const sizes = bubbleData.map(item => {
                    const len = item.text.length;
                    if (len <= 2) return 70;
                    else if (len <= 4) return 85;
                    else if (len <= 6) return 100;
                    else return 115;
                });

                // ---- 控制条（顶部重新开始） ----
                const controlBar = document.createElement('div');
                controlBar.className = 'game-control-bar';
                const restartBtn = document.createElement('button');
                restartBtn.className = 'btn';
                restartBtn.textContent = '🔄 重新开始';
                restartBtn.addEventListener('click', goHome);
                controlBar.appendChild(restartBtn);

                // 单人模式显示计时器
                if (mode === 'single') {
                    const timerDisplay = document.createElement('span');
                    timerDisplay.className = 'timer-display';
                    timerDisplay.id = 'timerDisplay';
                    timerDisplay.textContent = '00:00';
                    controlBar.appendChild(timerDisplay);
                }
                gameArea.appendChild(controlBar);

                // ---- 游戏内容 ----
                if (mode === 'dual') {
                    gameArea.classList.add('dual-mode');
                    // 左玩家
                    const leftSide = document.createElement('div');
                    leftSide.className = 'player-side';
                    leftSide.id = 'playerLeft';
                    const leftLabel = document.createElement('div');
                    leftLabel.className = 'player-label';
                    leftLabel.textContent = '👤 玩家1';
                    leftSide.appendChild(leftLabel);
                    const leftTimer = document.createElement('div');
                    leftTimer.className = 'player-timer';
                    leftTimer.id = 'leftTimerDisplay';
                    leftTimer.textContent = '00:00';
                    leftSide.appendChild(leftTimer);
                    gameArea.appendChild(leftSide);

                    // 右玩家
                    const rightSide = document.createElement('div');
                    rightSide.className = 'player-side';
                    rightSide.id = 'playerRight';
                    const rightLabel = document.createElement('div');
                    rightLabel.className = 'player-label';
                    rightLabel.textContent = '👤 玩家2';
                    rightSide.appendChild(rightLabel);
                    const rightTimer = document.createElement('div');
                    rightTimer.className = 'player-timer';
                    rightTimer.id = 'rightTimerDisplay';
                    rightTimer.textContent = '00:00';
                    rightSide.appendChild(rightTimer);
                    gameArea.appendChild(rightSide);

                    gameState.leftSelected = null;
                    gameState.rightSelected = null;
                    gameState.leftMatched = new Set();
                    gameState.rightMatched = new Set();
                    gameState.leftFinished = false;
                    gameState.rightFinished = false;
                    gameState.leftFinishTime = 0;
                    gameState.rightFinishTime = 0;
                    gameState.leftTimerInterval = null;
                    gameState.rightTimerInterval = null;
                    gameState.leftResultShown = false;
                    gameState.rightResultShown = false;

                    // 生成位置并创建气泡
                    setTimeout(() => {
                        const leftW = leftSide.offsetWidth - 10;
                        const leftH = leftSide.offsetHeight - 30;
                        const rightW = rightSide.offsetWidth - 10;
                        const rightH = rightSide.offsetHeight - 30;
                        const leftPositions = generateBubblePositions(leftW, leftH, sizes);
                        const rightPositions = generateBubblePositions(rightW, rightH, sizes);
                        gameState.leftBubbles = [];
                        gameState.rightBubbles = [];
                        for (let i = 0; i < bubbleData.length; i++) {
                            const bd = bubbleData[i];
                            const lb = createBubbleElement(bd.text, bd.wordId, bd.pairKey, leftPositions[i].x,
                                leftPositions[i].y + 28, leftPositions[i].size, leftSide, bd.lang);
                            const rb = createBubbleElement(bd.text, bd.wordId, bd.pairKey, rightPositions[i].x,
                                rightPositions[i].y + 28, rightPositions[i].size, rightSide, bd.lang);
                            gameState.leftBubbles.push(lb);
                            gameState.rightBubbles.push(rb);
                        }
                        startGame();
                    }, 100);

                } else {
                    // 单人模式
                    gameArea.classList.add('active');
                    const container = gameArea;
                    gameState.selected = null;
                    gameState.matched = new Set();
                    gameState.bubbles = [];

                    setTimeout(() => {
                        const cw = container.offsetWidth - 10;
                        const ch = container.offsetHeight - 10;
                        const positions = generateBubblePositions(cw, ch, sizes);
                        for (let i = 0; i < bubbleData.length; i++) {
                            const bd = bubbleData[i];
                            const b = createBubbleElement(bd.text, bd.wordId, bd.pairKey, positions[i].x, positions[i].y,
                                positions[i].size, container, bd.lang);
                            gameState.bubbles.push(b);
                        }
                        startGame();
                    }, 100);
                }
            }

            function handleBubbleClick(bubble, container) {
                if (!gameState || !gameState.isPlaying) return;
                const mode = levelConfig.mode;
                if (mode === 'dual') {
                    const isLeft = container.id === 'playerLeft';
                    const selectedKey = isLeft ? 'leftSelected' : 'rightSelected';
                    const matchedKey = isLeft ? 'leftMatched' : 'rightMatched';
                    const finishedKey = isLeft ? 'leftFinished' : 'rightFinished';
                    if (gameState[finishedKey]) return;
                    if (gameState[matchedKey].has(bubble.dataset.pairKey)) return;
                    if (gameState[selectedKey] === bubble) {
                        bubble.classList.remove('selected');
                        gameState[selectedKey] = null;
                        return;
                    }
                    if (gameState[selectedKey]) {
                        const first = gameState[selectedKey];
                        if (first.dataset.wordId === bubble.dataset.wordId &&
                            first.dataset.pairKey !== bubble.dataset.pairKey) {
                            first.classList.add('burst');
                            bubble.classList.add('burst');
                            playPopSound();
                            gameState[matchedKey].add(first.dataset.pairKey);
                            gameState[matchedKey].add(bubble.dataset.pairKey);
                            gameState[selectedKey] = null;
                            setTimeout(() => {
                                first.remove();
                                bubble.remove();
                            }, 350);
                            checkDualPlayerCompletion(isLeft);
                        } else {
                            first.classList.remove('selected');
                            bubble.classList.remove('selected');
                            first.classList.add('error');
                            bubble.classList.add('error');
                            playFailSound();
                            setTimeout(() => {
                                first.classList.remove('error', 'shaking');
                                bubble.classList.remove('error', 'shaking');
                                adjustBubbleColor(first);
                                adjustBubbleColor(bubble);
                            }, 500);
                            gameState[selectedKey] = null;
                        }
                    } else {
                        bubble.classList.add('selected');
                        gameState[selectedKey] = bubble;
                    }
                } else {
                    if (gameState.matched.has(bubble.dataset.pairKey)) return;
                    if (gameState.selected === bubble) {
                        bubble.classList.remove('selected');
                        gameState.selected = null;
                        return;
                    }
                    if (gameState.selected) {
                        const first = gameState.selected;
                        if (first.dataset.wordId === bubble.dataset.wordId &&
                            first.dataset.pairKey !== bubble.dataset.pairKey) {
                            first.classList.add('burst');
                            bubble.classList.add('burst');
                            playPopSound();
                            gameState.matched.add(first.dataset.pairKey);
                            gameState.matched.add(bubble.dataset.pairKey);
                            gameState.selected = null;
                            setTimeout(() => {
                                first.remove();
                                bubble.remove();
                            }, 350);
                            checkSingleCompletion();
                        } else {
                            first.classList.remove('selected');
                            bubble.classList.remove('selected');
                            first.classList.add('error');
                            bubble.classList.add('error');
                            playFailSound();
                            setTimeout(() => {
                                first.classList.remove('error', 'shaking');
                                bubble.classList.remove('error', 'shaking');
                                adjustBubbleColor(first);
                                adjustBubbleColor(bubble);
                            }, 500);
                            gameState.selected = null;
                        }
                    } else {
                        bubble.classList.add('selected');
                        gameState.selected = bubble;
                    }
                }
            }

            function checkDualPlayerCompletion(isLeft) {
                const matchedKey = isLeft ? 'leftMatched' : 'rightMatched';
                const finishedKey = isLeft ? 'leftFinished' : 'rightFinished';
                const totalPairs = getSelectedWords().length;
                const matchedPairs = gameState[matchedKey].size / 2;
                if (matchedPairs >= totalPairs) {
                    gameState[finishedKey] = true;
                    const elapsed = (Date.now() - gameState.startTime) / 1000;
                    if (isLeft) {
                        gameState.leftFinishTime = elapsed;
                        if (gameState.leftTimerInterval) {
                            clearInterval(gameState.leftTimerInterval);
                            gameState.leftTimerInterval = null;
                        }
                        const leftContainer = document.getElementById('playerLeft');
                        showPlayerResult(leftContainer, true, elapsed);
                        gameState.leftResultShown = true;
                    } else {
                        gameState.rightFinishTime = elapsed;
                        if (gameState.rightTimerInterval) {
                            clearInterval(gameState.rightTimerInterval);
                            gameState.rightTimerInterval = null;
                        }
                        const rightContainer = document.getElementById('playerRight');
                        showPlayerResult(rightContainer, true, elapsed);
                        gameState.rightResultShown = true;
                    }
                }
            }

            function checkSingleCompletion() {
                const totalPairs = getSelectedWords().length;
                const matchedPairs = gameState.matched.size / 2;
                if (matchedPairs >= totalPairs) {
                    const elapsed = (Date.now() - gameState.startTime) / 1000;
                    const container = document.getElementById('gameArea');
                    showFaceEffect(container, 'success');
                    showResultModal(true, elapsed, null);
                }
            }

            function showResultModal(success, elapsed, playerSide) {
                clearGameTimers();
                if (gameState) gameState.isPlaying = false;
                const modal = document.getElementById('resultModal');
                const emoji = document.getElementById('resultEmoji');
                const text = document.getElementById('resultText');
                const timesDiv = document.getElementById('resultTimes');
                if (levelConfig.mode === 'single') {
                    emoji.textContent = success ? '😊' : '😢';
                    text.textContent = success ? '你太厉害了！' : '再接再厉！';
                    timesDiv.textContent = '总用时：' + (elapsed ? elapsed.toFixed(1) : '0') + '秒';
                    showModal('resultModal');
                }
            }

            function startGame() {
                if (!gameState) return;
                const mode = levelConfig.mode;
                gameState.isPlaying = true;
                gameState.startTime = Date.now();
                gameState.elapsed = 0;
                clearGameTimers();

                if (mode === 'single') {
                    const timerDisplay = document.getElementById('timerDisplay');
                    if (timerDisplay) timerDisplay.style.display = 'block';
                    const timerMode = levelConfig.timerMode;
                    if (timerMode === 'up') {
                        gameTimers.push(setInterval(() => {
                            if (!gameState || !gameState.isPlaying) return;
                            gameState.elapsed = (Date.now() - gameState.startTime) / 1000;
                            updateTimerDisplay(timerDisplay, gameState.elapsed);
                        }, 100));
                    } else {
                        const totalSeconds = levelConfig.countdownSeconds;
                        gameState.remaining = totalSeconds;
                        gameTimers.push(setInterval(() => {
                            if (!gameState || !gameState.isPlaying) return;
                            gameState.remaining -= 0.1;
                            if (gameState.remaining <= 0) {
                                gameState.remaining = 0;
                                updateTimerDisplay(timerDisplay, 0);
                                handleTimeout();
                                return;
                            }
                            gameState.elapsed = totalSeconds - gameState.remaining;
                            updateTimerDisplay(timerDisplay, gameState.remaining);
                        }, 100));
                    }
                    const modeCheck = setInterval(() => {
                        if (!gameState || !gameState.isPlaying) return;
                        const totalPairs = getSelectedWords().length;
                        const matchedPairs = gameState.matched ? gameState.matched.size / 2 : 0;
                        if (matchedPairs >= totalPairs) {
                            clearInterval(modeCheck);
                            gameTimers = gameTimers.filter(t => t !== modeCheck);
                        }
                    }, 200);
                    gameTimers.push(modeCheck);
                } else {
                    const leftTimer = document.getElementById('leftTimerDisplay');
                    const rightTimer = document.getElementById('rightTimerDisplay');
                    if (!leftTimer || !rightTimer) return;
                    const timerMode = levelConfig.timerMode;

                    const updateLeft = () => {
                        if (gameState.leftFinished) return;
                        const elapsed = (Date.now() - gameState.startTime) / 1000;
                        updateTimerDisplay(leftTimer, elapsed);
                    };
                    const updateRight = () => {
                        if (gameState.rightFinished) return;
                        const elapsed = (Date.now() - gameState.startTime) / 1000;
                        updateTimerDisplay(rightTimer, elapsed);
                    };

                    if (timerMode === 'up') {
                        gameState.leftTimerInterval = setInterval(updateLeft, 100);
                        gameState.rightTimerInterval = setInterval(updateRight, 100);
                        gameTimers.push(gameState.leftTimerInterval);
                        gameTimers.push(gameState.rightTimerInterval);
                    } else {
                        const totalSeconds = levelConfig.countdownSeconds;
                        gameState.remaining = totalSeconds;
                        gameState.leftTimerInterval = setInterval(() => {
                            if (gameState.leftFinished) return;
                            gameState.remaining -= 0.1;
                            if (gameState.remaining <= 0) {
                                gameState.remaining = 0;
                                updateTimerDisplay(leftTimer, 0);
                                if (!gameState.leftFinished) {
                                    gameState.leftFinished = true;
                                    gameState.leftFinishTime = totalSeconds;
                                    const leftContainer = document.getElementById('playerLeft');
                                    showPlayerResult(leftContainer, false, totalSeconds);
                                    gameState.leftResultShown = true;
                                    if (gameState.leftTimerInterval) {
                                        clearInterval(gameState.leftTimerInterval);
                                        gameState.leftTimerInterval = null;
                                    }
                                }
                                return;
                            }
                            updateTimerDisplay(leftTimer, gameState.remaining);
                            updateTimerDisplay(rightTimer, gameState.remaining);
                        }, 100);
                        gameState.rightTimerInterval = setInterval(() => {
                            if (gameState.rightFinished) return;
                            const remain = gameState.remaining;
                            updateTimerDisplay(rightTimer, remain < 0 ? 0 : remain);
                            if (gameState.remaining <= 0 && !gameState.rightFinished) {
                                gameState.rightFinished = true;
                                gameState.rightFinishTime = totalSeconds;
                                const rightContainer = document.getElementById('playerRight');
                                showPlayerResult(rightContainer, false, totalSeconds);
                                gameState.rightResultShown = true;
                                if (gameState.rightTimerInterval) {
                                    clearInterval(gameState.rightTimerInterval);
                                    gameState.rightTimerInterval = null;
                                }
                            }
                        }, 100);
                        gameTimers.push(gameState.leftTimerInterval);
                        gameTimers.push(gameState.rightTimerInterval);
                    }
                }
            }

            function updateTimerDisplay(display, seconds) {
                if (!display) return;
                const abs = Math.abs(seconds);
                const mins = Math.floor(abs / 60);
                const secs = Math.floor(abs % 60);
                display.textContent = (mins < 10 ? '0' : '') + mins + ':' + (secs < 10 ? '0' : '') + secs;
            }

            function handleTimeout() {
                clearGameTimers();
                if (gameState) gameState.isPlaying = false;
                const mode = levelConfig.mode;
                if (mode === 'single') {
                    const container = document.getElementById('gameArea');
                    showFaceEffect(container, 'fail');
                    showResultModal(false, levelConfig.countdownSeconds, null);
                }
            }

            // ==================== 开始游戏按钮 ====================
            document.getElementById('startGameBtn').addEventListener('click', () => {
                if (levelConfig.selectedWordIds.size < 2) {
                    alert('⚠️ 请先进行关卡设置，并选择至少2组词汇！');
                    return;
                }
                resetGameArea();
                showGameArea();
                gameState = {
                    isPlaying: false,
                    selected: null,
                    matched: new Set(),
                    leftSelected: null,
                    rightSelected: null,
                    leftMatched: new Set(),
                    rightMatched: new Set(),
                    bubbles: [],
                    leftBubbles: [],
                    rightBubbles: [],
                    startTime: 0,
                    elapsed: 0,
                    remaining: 0,
                    timerMode: levelConfig.timerMode,
                    leftFinished: false,
                    rightFinished: false,
                    leftFinishTime: 0,
                    rightFinishTime: 0,
                    leftTimerInterval: null,
                    rightTimerInterval: null,
                    leftResultShown: false,
                    rightResultShown: false,
                };
                setupGameArea();
            });

            // ==================== 返回主页（单人模式） ====================
            document.getElementById('replayBtn').addEventListener('click', () => {
                hideModal('resultModal');
                goHome();
            });

            // ==================== 初始化 ====================
            renderWordbankTree();
            updateWordCountBadge();
            applyTheme(currentTheme);
            document.getElementById('countdownGroup').style.display =
                document.getElementById('timerMode').value === 'down' ? 'block' : 'none';

            console.log('🎮 词汇消消乐已加载完成！');
            console.log('📚 词库词汇数量:', countAllWords());
        })();
    </script>
</body>
</html>
